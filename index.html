<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino — asistent Zendino | Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #1a0a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Subtle animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: #7c3aed;
      top: -100px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #db2777;
      bottom: -100px; right: -100px;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .page-label {
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    /* Chat widget */
    .chat-widget {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 560px;
      max-height: 80vh;
    }

    /* Header bar */
    .chat-header {
      background: #5b21b6;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-avatar {
      width: 40px;
      height: 40px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px #4ade80;
    }

    .status-text {
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }

    .header-brand {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      background: #f8f7fc;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d1c4e9; border-radius: 2px; }

    /* Message bubbles */
    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.22s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg.dino .msg-bubble {
      background: #ffffff;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .msg.user .msg-bubble {
      background: #5b21b6;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .typing-bubble {
      background: #ffffff;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: #a78bfa;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    .typing-label {
      font-size: 11px;
      color: #9ca3af;
      padding-bottom: 2px;
    }

    /* Quick reply chips */
    .quick-replies {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 16px 4px;
      flex-shrink: 0;
      background: #f8f7fc;
    }

    .chip {
      background: #ffffff;
      border: 1.5px solid #ddd6fe;
      color: #5b21b6;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip:hover {
      background: #ede9fe;
      border-color: #7c3aed;
    }

    .chip:active {
      transform: scale(0.96);
    }

    /* Input area */
    .chat-input-area {
      padding: 12px 14px;
      border-top: 1px solid #ede9fe;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      color: #1a1a2e;
      background: #f8f7fc;
    }

    .chat-input::placeholder { color: #9ca3af; }
    .chat-input:focus { border-color: #7c3aed; background: #ffffff; }

    .send-btn {
      width: 40px;
      height: 40px;
      background: #5b21b6;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover { background: #7c3aed; }
    .send-btn:active { transform: scale(0.93); }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Bottom CTA */
    .page-cta {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      line-height: 1.7;
    }

    .page-cta a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
    }

    .page-cta a:hover { text-decoration: underline; }

    .velari-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <p class="page-label">Ukázka: jak Dino funguje na webu Zendino</p>

  <div class="chat-widget" role="main">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar" aria-hidden="true">🦕</div>
      <div class="header-info">
        <div class="header-name">Dino — asistent Zendino</div>
        <div class="header-status">
          <div class="status-dot"></div>
          <span class="status-text">Online</span>
        </div>
      </div>
      <div class="header-brand">Zendino</div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="messages" aria-live="polite" aria-label="Chat zprávy"></div>

    <!-- Quick reply chips -->
    <div class="quick-replies" id="quickReplies">
      <button class="chip" onclick="sendChip('Rezervace')">Rezervace</button>
      <button class="chip" onclick="sendChip('Menu')">Menu</button>
      <button class="chip" onclick="sendChip('Otevírací doba')">Otevírací doba</button>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <input
        type="text"
        class="chat-input"
        id="userInput"
        placeholder="Zprávu napište..."
        autocomplete="off"
        aria-label="Napište zprávu"
        onkeydown="handleKey(event)"
      />
      <button class="send-btn" onclick="sendMessage()" aria-label="Odeslat">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>

  <div class="page-cta">
    Chcete Dina pro vaši restauraci?<br>
    <a href="mailto:velari.biz@gmail.com">velari.biz@gmail.com</a>
    <div class="velari-badge">Vytvořeno s Velari.ai</div>
  </div>

</div>

<script>
  const RESPONSES = [
    {
      keywords: ['bezlepk', 'gluten'],
      reply: 'Ano, máme bezlepkové možnosti. Bezlepkové jsou například: pad thai, polévka pho a smažená rýže s tofu. Chtěli byste rovnou zarezervovat stůl?'
    },
    {
      keywords: ['alerg', 'alergen'],
      reply: 'Máme přehled alergenů ke každému jídlu. Na co konkrétně se ptáte? Mohu vám poradit, které pokrmy jsou pro vás vhodné.'
    },
    {
      keywords: ['rezerv', 'stůl', 'stul', 'místo', 'misto'],
      reply: 'Rezervaci zařídím rádi. Na který den a kolik hostů? Alternativně nás můžete zavolat nebo napsat přímo přes web.'
    },
    {
      keywords: ['otevír', 'otevir', 'hodiny', 'kdy', 'otevřen', 'otevreni'],
      reply: 'Jsme otevřeni pondělí–pátek 11:00–22:00, víkendy 12:00–23:00. Chcete rovnou zarezervovat?'
    },
    {
      keywords: ['menu', 'jídl', 'jidl', 'jídelní', 'jidelni', 'jíst', 'jist'],
      reply: 'Naše menu nabízí asijskou streetfood kuchyni — polévky pho, pad thai, vietnamské sendviče bánh mì a další. Rádi vám poradím s výběrem — co máte nejraději?'
    },
    {
      keywords: ['rozvoz', 'donáška', 'donaska', 'dovoz', 'doruč', 'doruc', 'doručení', 'doruceni'],
      reply: 'Rozvoz zajišťujeme přes Foodora a Wolt. Objednávku zadáte přímo v aplikaci, doručení obvykle do 30–45 minut.'
    },
    {
      keywords: ['věrnost', 'vernost', 'body', 'program', 'karta', 'věrnostní', 'vernostni'],
      reply: 'Věrnostní program Zendino funguje jednoduše — za každou útratu získáte body, které pak uplatníte na slevy a odměny. Přihlásíte se na místě nebo přes web.'
    },
    {
      keywords: ['parkování', 'parkovani', 'kde', 'adresa', 'najdu', 'najít', 'najit'],
      reply: 'Zendino najdete v centru Ostravy. Parkování je možné v přilehlém parkovišti. Chcete odkaz na mapu nebo rovnou zarezervovat stůl?'
    },
    {
      keywords: ['ahoj', 'hello', 'dobrý den', 'dobry den', 'hej', 'zdravím', 'zdravim', 'čau', 'cau'],
      reply: 'Ahoj! Pomohu vám s rezervací, menu, otevírací dobou nebo čímkoli dalším. Co pro vás mohu udělat?'
    }
  ];

  const FALLBACK = 'To mi upřesněte — rád pomohu. Ptáte se na rezervaci, menu, otevírací dobu nebo něco jiného?';

  function getReply(text) {
    const lower = text.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .normalize('NFC');
    for (const item of RESPONSES) {
      if (item.keywords.some(k => lower.includes(k.normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC')))) {
        return item.reply;
      }
    }
    return FALLBACK;
  }

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');

  function appendMessage(text, role) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    if (role === 'dino') {
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.setAttribute('aria-hidden', 'true');
      av.textContent = '🦕';
      msg.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);

    messagesEl.appendChild(msg);
    scrollBottom();
    return msg;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'typing-indicator';
    wrap.id = 'typing';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.setAttribute('aria-hidden', 'true');
    av.textContent = '🦕';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    const label = document.createElement('span');
    label.className = 'typing-label';
    label.textContent = 'Dino píše...';

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    wrap.appendChild(label);
    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    appendMessage(text, 'user');
    showTyping();
    setTimeout(() => {
      removeTyping();
      appendMessage(getReply(text), 'dino');
    }, 900);
  }

  function sendChip(text) {
    inputEl.value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter') sendMessage();
  }

  // Greeting on load
  setTimeout(() => {
    appendMessage('Ahoj! Jsem Dino 🦕, asistent Zendina. Jak vám mohu pomoci?', 'dino');
  }, 900);
</script>
</body>
</html>
